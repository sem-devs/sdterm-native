[package]
name = "sdterm-native"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
dirs = "7.0.0"
fastrand = "2.5.0"
gpui = "0.2.2"
gpui-terminal = { path = "crates/gpui-terminal" }
parking_lot = "0.12"
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sysinfo = "0.40.3"
unicode-segmentation = "1.13.3"
ureq = "3.5.1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
# Small and fast: the installer is mostly this one file.
lto = "thin"
strip = true
codegen-units = 4

# xattr 0.2.3 (pulled in by GPUI) does not build on Linux with a current libc: the patched copy uses
# ENODATA there. Remove once GPUI moves to a newer xattr.
[patch.crates-io]
xattr = { path = "crates/xattr" }
