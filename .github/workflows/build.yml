name: Build

# Tests everywhere and builds the Linux and Windows downloads: the installer (Windows), the AppImage,
# .deb and .tar.gz (Linux), the plain .zip, the update feeds (latest-win.json, latest-linux.json) and
# the checksums. The macOS app is built, signed and notarized on a Mac with scripts/package-mac.sh,
# because that needs the Developer ID certificate.
# Run it by hand (Actions, Build) or push a tag like v0.1.0.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # What GPUI needs to talk to the windowing system, fonts and the GPU.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config libasound2-dev libfontconfig-dev \
            libwayland-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libvulkan-dev \
            libssl-dev libzstd-dev libgit2-dev
      - run: cargo test --release
      - run: cargo build --release
      - name: Libraries the program needs at run time
        run: ldd target/release/sdterm-native
      - name: Package (tar.gz, deb, AppImage, feed)
        run: scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sdterm-native-linux
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.AppImage
            dist/latest-linux.json
            dist/SHA256SUMS-linux.txt

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release
      - name: Package (installer, zip, feed)
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: sdterm-native-windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/latest-win.json
            dist/SHA256SUMS-win.txt

  macos-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
